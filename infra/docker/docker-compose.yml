services:
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../../.env
    environment:
      - ENVIRONMENT=development
    volumes:
      - ../../apps/api/app:/app/app:ro
    restart: unless-stopped

